# Static site, no build step — Netlify serves the repo root as-is.

[build]
  publish = "."

# Pretty URLs: /artwork/ resolves to /artwork/index.html automatically.
# Custom 404 fallback for unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Security headers — applied to every response.
# CSP notes:
#   - img-src allows any https host: artwork images are user-submitted from arbitrary
#     hosts in the shared Noroff pool, so they can't be enumerated (data: covers the
#     lazy-load placeholder pixels).
#   - the script-src hash is the inline "js"-flag script shared by the auth/studio/
#     profile pages; no other inline scripts exist, so no 'unsafe-inline'.
#   - style-src keeps 'unsafe-inline' only for static style="" attributes (e.g. the
#     hidden SVG sprite); all real styles are self-hosted files.
#   - connect-src is just the Noroff API; the studio image probe uses new Image()
#     (img-src), not fetch.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-ZnYJX5ypMaaAhxxWhSEjbMkhO2A9yPmbzEQH3LFaITA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://v2.api.noroff.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
